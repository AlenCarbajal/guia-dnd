<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
<title>Armador de Personajes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grenze:wght@500;600;700&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap">
<style>
/* Layout: top bar (personaje + vista), then builder = step nav | form | sticky computed summary with overrides; sheet view = paper pages.
   Same cave-stone/amethyst system as the Grimorio and the Warlock calculator. */
:root{
  --bg:#eceef2; --surface:#fbfbfd; --sunk:#f2f2f7; --fg:#1f1b2e; --muted:#625d72; --line:#d8d7e1; --ink:#2b2642;
  --accent:#5b37c4; --accent-soft:#ece6fb; --glow:#a82d80; --warn:#a8431c; --warn-soft:#fbece4; --ok:#1d7563;
  --display:"Grenze",Georgia,serif; --body:"Alegreya Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#13111a; --surface:#1c1926; --sunk:#17151f; --fg:#ebe7f3; --muted:#a19ab3; --line:#302c3e; --ink:#cdc6e0;
  --accent:#b49bff; --accent-soft:#2a2342; --glow:#e47cc4; --warn:#f0905f; --warn-soft:#38211a; --ok:#6fd0b4; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13111a; --surface:#1c1926; --sunk:#17151f; --fg:#ebe7f3; --muted:#a19ab3; --line:#302c3e; --ink:#cdc6e0;
  --accent:#b49bff; --accent-soft:#2a2342; --glow:#e47cc4; --warn:#f0905f; --warn-soft:#38211a; --ok:#6fd0b4; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15.5px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 48px;font-variant-numeric:tabular-nums}
.wrap{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h3{font-family:var(--display);margin:0;line-height:1.1;text-wrap:balance}
h1{font-size:1.9rem;font-weight:700}
h3{font-size:1.25rem;font-weight:600;margin-bottom:10px}
a{color:var(--accent)}
.top{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;border-bottom:1.5px solid var(--ink);padding-bottom:12px}
.top .grp{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sync{font-size:.82rem;color:var(--muted);font-style:italic}
button,select,input,textarea{font:inherit;color:var(--fg)}
button{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 13px;cursor:pointer}
button:hover{border-color:var(--accent)}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
select,input[type=text],input[type=number],input[type=search],textarea{background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:5px 7px;width:100%;min-width:0}
textarea{resize:vertical;line-height:1.4}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--surface)}
.seg button{border:0;padding:4px 14px;color:var(--muted);background:transparent}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
#chars{width:auto;max-width:260px;font-weight:700}
.delbar{background:var(--warn-soft);border:1px solid var(--warn);border-radius:8px;padding:8px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
/* builder */
.builder{display:grid;grid-template-columns:180px minmax(0,1fr) 330px;gap:16px;align-items:start}
@media (max-width:1100px){.builder{grid-template-columns:minmax(0,1fr) 320px}.nav{grid-column:1/-1;flex-direction:row!important;flex-wrap:wrap;position:static!important}}
@media (max-width:760px){.builder{grid-template-columns:minmax(0,1fr)}.side{position:static!important;max-height:none!important}}
.nav{display:flex;flex-direction:column;gap:2px;position:sticky;top:max(12px,env(safe-area-inset-top,0px))}
.nav button{border:0;border-radius:6px;text-align:left;padding:6px 10px;background:transparent;color:var(--muted)}
.nav button:hover{background:var(--sunk);color:var(--fg)}
.nav button[aria-current="step"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
#step{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.hint{color:var(--muted);font-size:.9rem;margin:8px 0 0}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;align-items:end}
.g5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fld>span,.lbl{font-size:.8rem;color:var(--muted);font-weight:500}
.wide{grid-column:1/-1}
.chk{display:flex;align-items:center;gap:6px;font-size:.93rem;white-space:nowrap}
.chk input{accent-color:var(--accent);width:16px;height:16px}
.add{border-style:dashed;color:var(--accent);margin-top:8px}
.add.sm{padding:2px 9px;font-size:.85rem;margin:0}
.x{border-color:transparent;color:var(--warn);padding:2px 9px;font-size:.88rem}
.x:hover{border-color:var(--warn)}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;align-items:center}
.clsrow,.atkrow,.custom{border-top:1px dashed var(--line);padding-top:10px;margin-top:10px}
.clsrow:first-of-type{border-top:0;margin-top:0;padding-top:0}
.slotrow,.modrow,.sprow,.skrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}
.slotrow>select,.slotrow>input{width:auto;flex:1 1 140px}
.modrow>select{flex:2 1 200px;width:auto}.modrow>select+select{flex:1 1 90px}.modrow>input{width:auto;flex:1 1 70px}.modrow>input:last-of-type{flex:2 1 120px}
.mods{margin-top:6px}
.sktable{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:0 18px}
.skrow span{flex:1;min-width:0}.skrow small{color:var(--muted)}.skrow select{width:130px}.skrow b{width:34px;text-align:right}.skrow input{width:64px}
.abgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.abc{background:var(--sunk);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center}
.abc>b{font-family:var(--display);font-size:1.1rem}.abc input{text-align:center;font-size:1.2rem;font-weight:700}
.abc small{color:var(--muted)}
.sprow .lv{width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:.8rem;flex:none}
.sprow b{min-width:0}.sprow small{color:var(--muted);flex:1 1 160px}
.sprow .desc{flex-basis:100%}
.ok{color:var(--ok);font-size:.85rem;font-weight:700}
.pill{display:inline-block;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:2px 11px;font-size:.88rem;margin:0 6px 6px 0}
.flist{margin:0;padding-left:18px}.flist li{margin:3px 0}.flist small{color:var(--muted)}
details.desc summary{font-size:.82rem;color:var(--accent);cursor:pointer}
details.desc div{font-size:.9rem;color:var(--fg);background:var(--sunk);border-radius:6px;padding:8px 10px;margin-top:4px;max-width:75ch}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chips small{opacity:.7}
.hblist{list-style:none;margin:8px 0 0;padding:0}.hblist li{display:flex;gap:8px;align-items:center;padding:4px 0;border-bottom:1px dashed var(--line)}
.hblist li.on .lnk{font-weight:700;color:var(--accent)}.hblist small{color:var(--muted);flex:1}
.lnk{border:0;background:none;padding:0;color:var(--fg);text-decoration:underline;text-decoration-color:var(--line)}
.hbform{border-color:var(--accent)}
.rolls{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:8px}
code{font-size:.85em;background:var(--sunk);padding:0 4px;border-radius:4px}
/* summary */
.side{position:sticky;top:max(12px,env(safe-area-inset-top,0px));max-height:calc(100vh - 24px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 12px 6px}
.sm-head{display:flex;flex-direction:column;border-bottom:1.5px solid var(--ink);padding-bottom:8px;margin-bottom:8px}
.sm-head b{font-family:var(--display);font-size:1.35rem}.sm-head span{color:var(--muted);font-size:.9rem}
.sm-ab{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-bottom:8px}
.sm-ab div{background:var(--sunk);border-radius:6px;text-align:center;padding:4px 0;display:flex;flex-direction:column}
.sm-ab small{font-size:.7rem;color:var(--muted);font-weight:700}.sm-ab b{font-family:var(--display);font-size:1.15rem;color:var(--accent)}.sm-ab span{font-size:.78rem}
.sm-ab div.ov,.sm-row.ov{box-shadow:inset 3px 0 0 var(--glow)}
.sm-row{display:grid;grid-template-columns:minmax(0,1fr) auto 62px;gap:2px 8px;align-items:center;padding:4px 0 4px 6px;border-bottom:1px dashed var(--line)}
.sm-l{font-size:.88rem}.sm-v{font-family:var(--display);font-size:1.1rem;text-align:right}
.sm-o{padding:2px 5px!important;font-size:.85rem;text-align:center}
.sm-b{grid-column:1/-1;font-size:.72rem;color:var(--muted);line-height:1.3}
.warns{background:var(--warn-soft);border-left:3px solid var(--warn);border-radius:4px 8px 8px 4px;padding:6px 10px;margin-bottom:8px;font-size:.86rem}
.warns b{color:var(--warn)}.warns ul{margin:4px 0 0;padding-left:16px}
/* sheet view */
.sheetbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sheetwrap{overflow-x:auto;padding:4px 0 10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="grp"><h1>Armador de Personajes</h1><span class="sync" id="sync" role="status" aria-live="polite"></span></div>
    <div class="grp">
      <label for="chars" class="sync" style="font-style:normal">Personaje</label><select id="chars"></select>
      <button type="button" data-act="new">Nuevo</button><button type="button" data-act="dup">Duplicar</button><button type="button" data-act="delask">Borrar</button>
      <div class="seg" role="group" aria-label="Vista"><button type="button" data-act="view" data-view="build" data-v="build">Armar</button><button type="button" data-act="view" data-view="sheet" data-v="sheet">Hoja</button></div>
    </div>
  </header>
  <div class="delbar" id="delbar" hidden><span>¿Borrar este personaje? No se puede deshacer.</span><button type="button" data-act="delyes">Sí, borrar</button><button type="button" data-act="delno">Cancelar</button></div>

  <div id="build" class="builder">
    <nav class="nav" id="nav" aria-label="Pasos"></nav>
    <main id="step"></main>
    <aside class="side" id="summary" aria-label="Resumen calculado"></aside>
  </div>

  <div id="sheetView" hidden>
    <div class="sheetbar"><button type="button" data-act="exsheet">Descargar hoja (.html)</button><button type="button" id="printBtn" data-act="print" hidden>Imprimir / PDF</button>
      <span class="sync">5 páginas: frente, spellcasting, rasgos, grimorio y reglas de la casa.</span></div>
    <div class="sheetwrap"><div id="sheet"></div></div>
  </div>
</div>
<script src="data.js"></script>
<script src="app.js"></script>

</body>
</html>
